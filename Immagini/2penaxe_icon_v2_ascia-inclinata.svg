<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 2PenAxE — icona N47Lab per TriviumCAD — v2 "ascia" (03/10/2026)
       Rebus: foglio millimetrato + penna inclinata (lama d'ascia) + manico ottone che sporge sotto.
       Standard scuro: sfondo trasparente, foglio #10243F, griglia #78a0dc tenue,
       penna #dde6f5/#f0b429, ottone #b87333/#d4944a. -->
  <defs>
    <clipPath id="sheetClip">
      <rect x="76" y="72" width="360" height="300" rx="26"/>
    </clipPath>
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f6ff"/>
      <stop offset="0.55" stop-color="#dde6f5"/>
      <stop offset="1" stop-color="#b9c8de"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4a20"/>
      <stop offset="0.3" stop-color="#b87333"/>
      <stop offset="0.58" stop-color="#d4944a"/>
      <stop offset="1" stop-color="#9a6229"/>
    </linearGradient>
  </defs>

  <!-- FOGLIO MILLIMETRATO -->
  <rect x="76" y="72" width="360" height="300" rx="26" fill="#10243F"/>
  <g clip-path="url(#sheetClip)">
    <path d="M106 72 V372 M136 72 V372 M166 72 V372 M196 72 V372 M226 72 V372 M256 72 V372 M286 72 V372 M316 72 V372 M346 72 V372 M376 72 V372 M406 72 V372 M76 102 H436 M76 132 H436 M76 162 H436 M76 192 H436 M76 222 H436 M76 252 H436 M76 282 H436 M76 312 H436 M76 342 H436"
          fill="none" stroke="#78a0dc" stroke-opacity="0.18" stroke-width="1.2"/>
    <path d="M196 72 V372 M316 72 V372 M76 192 H436 M76 312 H436"
          fill="none" stroke="#78a0dc" stroke-opacity="0.32" stroke-width="1.6"/>
  </g>
  <rect x="76" y="72" width="360" height="300" rx="26" fill="none" stroke="#78a0dc" stroke-opacity="0.55" stroke-width="3"/>

  <!-- MANICO D'ASCIA (ottone) — entra nella testa-penna e sporge sotto -->
  <rect x="248" y="158" width="36" height="282" rx="15" fill="url(#brass)" stroke="#6b3f1a" stroke-opacity="0.65" stroke-width="2"/>
  <rect x="242" y="386" width="48" height="24" rx="8" fill="#d4944a" stroke="#7a4a20" stroke-width="2"/>
  <line x1="254" y1="390" x2="254" y2="406" stroke="#7a4a20" stroke-width="1.6" stroke-opacity="0.7"/>
  <line x1="278" y1="390" x2="278" y2="406" stroke="#7a4a20" stroke-width="1.6" stroke-opacity="0.7"/>
  <rect x="257" y="428" width="18" height="28" rx="8" fill="#7a4a20"/>

  <!-- TESTA D'ASCIA = PENNA INCLINATA (lama verso il basso-sinistra, fondello-corno in alto) -->
  <g transform="translate(227 190) rotate(-36)">
    <path d="M98 -21 L108 -21 L128 -9 L128 9 L108 21 L98 21 Z" fill="url(#brass)" stroke="#6b3f1a" stroke-opacity="0.65" stroke-width="2" stroke-linejoin="round"/>
    <rect x="-58" y="-23" width="158" height="46" rx="10" fill="url(#barrel)" stroke="#8fa3bf" stroke-width="2"/>
    <line x1="-48" y1="-10" x2="88" y2="-10" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    <rect x="-42" y="-7" width="124" height="14" rx="7" fill="#f0b429" stroke="#d9a23c" stroke-width="1.5"/>
    <path d="M-58 -23 L-58 23 L-104 13 L-126 0 L-104 -13 Z" fill="#dde6f5" stroke="#9fb3cc" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-104 13 L-126 0 L-104 -13 Z" fill="#9fb3cc"/>
  </g>
</svg>
